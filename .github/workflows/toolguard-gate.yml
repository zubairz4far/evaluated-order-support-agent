name: ToolGuard Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [toolguard-core-v0, toolguard-platform-v03, feat/toolguard-v0.4-hardening, feat/toolguard-v1-agent-reliability]

permissions:
  contents: read

jobs:
  toolguard-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ToolGuard platform dependencies
        run: python -m pip install -e '.[platform]'

      - name: Compile ToolGuard
        run: python -m compileall -q toolguard order_agent

      - name: Run ToolGuard tests
        run: python -m unittest discover -s tests -p 'test_toolguard*.py' -v

      - name: Evaluate example trace fixture
        run: python -m toolguard.cli evaluate examples/toolguard_traces.jsonl

      - name: Summarize observability telemetry
        run: python -m toolguard.cli analytics examples/toolguard_traces.jsonl

      - name: Smoke test platform app
        run: python -c "from toolguard.platform import app; assert app.version == '1.0.0'; print(app.title, app.version)"

      - name: Evaluate guarded order-agent pipeline
        run: python -m toolguard.order_agent_benchmark --json

      - name: Run locked 100-case Qwen-contract benchmark
        run: |
          python -m toolguard.cli benchmark --provider qwen-contract-replay --output /tmp/toolguard-v1.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/toolguard-v1.json'))
          assert p['benchmark']['sha256'] == 'd005de66762008999db1a37469231fc5ae0554dad16f0336827265db35dafaa9'
          assert p['passed_cases'] == 100
          assert p['failed_cases'] == 0
          assert p['unexpected_tool_calls'] == 0
          assert p['release_gate']['decision'] == 'PASS'
          PY

      - name: Demonstrate regression blocking
        shell: bash
        run: |
          set +e
          python -m toolguard.cli compare examples/toolguard_baseline.jsonl examples/toolguard_candidate_regression.jsonl
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected regression fixture to be blocked with exit code 1, got $status"
            exit 1
          fi
          echo "Intentional regression was correctly blocked."

      - name: Validate Compose configuration
        env:
          TOOLGUARD_API_KEY: ci-secret
        run: docker compose config -q

      - name: Build hardened container
        run: docker build -t toolguard:ci .

      - name: Smoke test container, auth, providers and benchmark API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name toolguard-ci -e TOOLGUARD_API_KEY=ci-secret -p 8000:8000 toolguard:ci
          trap 'docker logs toolguard-ci || true; docker rm -f toolguard-ci || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          grep -q '"version":"1.0.0"' /tmp/health.json

          status=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' http://127.0.0.1:8000/api/providers)
          test "$status" = "401"

          curl -fsS -H 'X-API-Key: ci-secret' http://127.0.0.1:8000/api/providers >/tmp/providers.json
          grep -q 'qwen-contract-replay' /tmp/providers.json
          grep -q 'qwen-transformers' /tmp/providers.json

          curl -fsS \
            -H 'X-API-Key: ci-secret' \
            -H 'Content-Type: application/json' \
            -d '{"provider":"qwen-contract-replay"}' \
            http://127.0.0.1:8000/api/benchmarks/agent-reliability-v1/run \
            >/tmp/benchmark.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/benchmark.json'))
          assert p['passed_cases'] == 100
          assert p['failed_cases'] == 0
          assert p['release_gate']['decision'] == 'PASS'
          PY
