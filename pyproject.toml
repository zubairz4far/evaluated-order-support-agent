[project]
name = "evaluated-order-support-agent"
version = "0.3.0"
description = "Safe, evaluated tool-calling agent with ToolGuard reliability, observability, and platform API"
requires-python = ">=3.10"

[project.optional-dependencies]
model = ["transformers>=4.51", "peft>=0.15", "torch>=2.2", "accelerate>=1.2"]
demo = ["gradio>=5.0"]
observability = [
  "psycopg[binary]>=3.2",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp>=1.28",
]
platform = [
  "fastapi>=0.141,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.52,<1",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
include = ["order_agent*", "toolguard*"]
exclude = ["reports*", "tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
pythonpath = ["."]
