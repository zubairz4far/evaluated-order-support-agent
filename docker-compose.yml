services:
  toolguard:
    build: .
    environment:
      TOOLGUARD_API_KEY: ${TOOLGUARD_API_KEY:?Set TOOLGUARD_API_KEY before starting}
      TOOLGUARD_DATABASE_URL: postgresql://toolguard:toolguard@postgres:5432/toolguard
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: toolguard
      POSTGRES_USER: toolguard
      POSTGRES_PASSWORD: toolguard
    volumes:
      - toolguard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolguard -d toolguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  toolguard_postgres:
