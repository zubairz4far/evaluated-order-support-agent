apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: toolguard
  template:
    metadata:
      labels:
        app: toolguard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: toolguard
          image: evaluated-order-support-agent:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TOOLGUARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolguard-secrets
                  key: api-key
            - name: TOOLGUARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: toolguard-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: toolguard
spec:
  selector:
    app: toolguard
  ports:
    - name: http
      port: 80
      targetPort: http
